# Determined AI local cluster for EM-NS training pipeline.
# Usage:
#   cd training/determined
#   docker compose up -d
#   # WebUI: http://localhost:8080
#
# For GPU machines, set DET_SLOT_TYPE=cuda before starting:
#   DET_SLOT_TYPE=cuda docker compose up -d

version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: determined
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - determined-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  master:
    image: determinedai/determined-master:0.32.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./master.yaml:/etc/determined/master.yaml:ro
      - determined-checkpoints:/tmp/determined-checkpoints
    depends_on:
      db:
        condition: service_healthy
    environment:
      DET_DB_HOST: db
      DET_DB_PORT: 5432
      DET_DB_NAME: determined
      DET_DB_USER: postgres
      DET_DB_PASSWORD: postgres

  agent:
    image: determinedai/determined-agent:0.32.1
    restart: unless-stopped
    depends_on:
      - master
    environment:
      DET_MASTER_HOST: master
      DET_MASTER_PORT: 8080
      # Default to CPU for local dev; set to "cuda" on GPU machines
      DET_SLOT_TYPE: ${DET_SLOT_TYPE:-none}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - determined-checkpoints:/tmp/determined-checkpoints

volumes:
  determined-db:
  determined-checkpoints:
