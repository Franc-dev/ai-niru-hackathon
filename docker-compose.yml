services:
  backend:
    build:
      context: ./backend        # mirrors Railway rootDirectory=backend
      dockerfile: ../Dockerfile # Dockerfile lives at repo root
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          
      # load all secrets from local .env
    environment:
      # Overrides that differ from .env for containerised run
      - VECTOR_DB_TYPE=placeholder   # skip chromadb; not needed for voice
      - CHROMA_PERSIST_DIR=/app/backend/chroma_data
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=false
