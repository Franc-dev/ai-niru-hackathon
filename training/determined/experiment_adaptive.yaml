# Adaptive ASHA hyperparameter search for EM-NS LoRA training.
# Runs 20 trials with early stopping to find optimal LoRA config.
#
# Usage (on GPU cluster):
#   det -m http://<master_ip>:8080 experiment create \
#       training/determined/experiment_adaptive.yaml .

name: emns-lora-adaptive-asha
description: Adaptive ASHA HP search over LoRA fine-tuning (20 trials)

environment:
  image: determinedai/environments:cuda-11.8-pytorch-2.0-gpu-0.31.1

resources:
  slots_per_trial: 1

searcher:
  name: adaptive_asha
  metric: eval_loss
  smaller_is_better: true
  max_trials: 20
  max_rungs: 4
  divisor: 4
  max_length:
    epochs: 3

hyperparameters:
  base_model:
    type: const
    val: "Qwen/Qwen2.5-3B-Instruct"
  lora_r:
    type: categorical
    vals: [8, 16, 32, 64]
  lora_alpha:
    type: categorical
    vals: [16, 32, 64]
  lora_dropout:
    type: double
    minval: 0.0
    maxval: 0.1
  learning_rate:
    type: log
    minval: 1e-5
    maxval: 1e-3
    base: 10
  batch_size:
    type: categorical
    vals: [1, 2, 4]
  grad_accum:
    type: categorical
    vals: [4, 8, 16]
  warmup_ratio:
    type: double
    minval: 0.0
    maxval: 0.1
  weight_decay:
    type: double
    minval: 0.0
    maxval: 0.1
  # Fixed parameters
  num_epochs:
    type: const
    val: 3
  max_seq_length:
    type: const
    val: 1024
  language_filter:
    type: categorical
    vals: ["en", "sw", "all"]
  seed:
    type: const
    val: 42

entrypoint: python3 training/determined/train_det.py

bind_mounts:
  - host_path: /tmp/determined-checkpoints
    container_path: /tmp/determined-checkpoints

data:
  train_file: data/training/combined_train.jsonl
  eval_file: data/training/combined_val.jsonl
